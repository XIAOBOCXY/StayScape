services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayscape}
      POSTGRES_USER: ${POSTGRES_USER:-stayscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayscape}
    volumes:
      - stayscape_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-StayScape}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production-32chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stayscape}:${POSTGRES_PASSWORD:-stayscape}@db:5432/${POSTGRES_DB:-stayscape}
      MODE: ${MODE:-demo}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      # Used only in the server container when an operator requests a Wan image.
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      WAN_IMAGE_ENABLED: ${WAN_IMAGE_ENABLED:-false}
      WAN_IMAGE_MODEL: ${WAN_IMAGE_MODEL:-wan2.7-image}
      WAN_IMAGE_WORKSPACE_ID: ${WAN_IMAGE_WORKSPACE_ID:-}
      WAN_IMAGE_REGION: ${WAN_IMAGE_REGION:-cn-beijing}
      WAN_IMAGE_API_URL: ${WAN_IMAGE_API_URL:-}
      WAN_IMAGE_API_KEY: ${WAN_IMAGE_API_KEY:-}
      WAN_IMAGE_SIZE: ${WAN_IMAGE_SIZE:-1536*2048}
      WAN_IMAGE_WATERMARK: ${WAN_IMAGE_WATERMARK:-true}
      WAN_IMAGE_TIMEOUT_SECONDS: ${WAN_IMAGE_TIMEOUT_SECONDS:-90}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://openclaw:18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_AGENT_TARGET: ${OPENCLAW_AGENT_TARGET:-openclaw/default}
      OPENCLAW_PRIMARY_MODEL: ${OPENCLAW_PRIMARY_MODEL:?Set OPENCLAW_PRIMARY_MODEL in .env}
      OPENCLAW_TRANSPORT: ${OPENCLAW_TRANSPORT:-responses}
      OPENCLAW_RESPONSES_PATH: ${OPENCLAW_RESPONSES_PATH:-/v1/responses}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-stayscape-main}
      OPENCLAW_SKILL_VERSION: ${OPENCLAW_SKILL_VERSION:-1.0.0}
      OPENCLAW_SKILLS_READY: ${OPENCLAW_SKILLS_READY:-false}
      OPENCLAW_LIVE_READY: ${OPENCLAW_LIVE_READY:-false}
      OPENCLAW_RUNTIME_VERSION: ${OPENCLAW_RUNTIME_VERSION:-2026.6.9}
      STAYSCAPE_AGENT_TOOL_TOKEN: ${STAYSCAPE_AGENT_TOOL_TOKEN:-}
      FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_DM_ALLOW_FROM: ${FEISHU_DM_ALLOW_FROM:-}
      FEISHU_GROUP_ALLOW_FROM: ${FEISHU_GROUP_ALLOW_FROM:-}
      FEISHU_GROUP_SENDER_ALLOW_FROM: ${FEISHU_GROUP_SENDER_ALLOW_FROM:-}
      FEISHU_OPERATOR_ALLOW_FROM: ${FEISHU_OPERATOR_ALLOW_FROM:-}
      FEISHU_SUPPORT_ALLOW_FROM: ${FEISHU_SUPPORT_ALLOW_FROM:-}
      FEISHU_REQUIRE_MENTION: ${FEISHU_REQUIRE_MENTION:-true}
      POSTER_EMBED_REMOTE_IMAGES: ${POSTER_EMBED_REMOTE_IMAGES:-false}
      VISITOR_INTENT_HOLD_MINUTES: ${VISITOR_INTENT_HOLD_MINUTES:-30}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SEED_DEMO_ON_STARTUP: ${SEED_DEMO_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      # Generated images remain on the server and are ignored by Git.
      - ./runtime/generated-media:/app/generated_media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot may run Alembic plus the rich demo seed.  Give it enough
      # room before dependent web/OpenClaw services decide it is unhealthy.
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Official OpenClaw image, pinned to the version used by this project.
  # The live profile keeps the Gateway off the public host ports.
  openclaw:
    profiles: ["live"]
    build:
      context: .
      dockerfile: deploy/openclaw/Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.6.9-slim}
        OPENCLAW_RUNTIME_VERSION: ${OPENCLAW_RUNTIME_VERSION:-2026.6.9}
        OPENCLAW_INSTALL_METHOD: ${OPENCLAW_INSTALL_METHOD:-image}
        OPENCLAW_QWEN_PROVIDER_VERSION: ${OPENCLAW_QWEN_PROVIDER_VERSION:-2026.6.9}
        OPENCLAW_FEISHU_VERSION: ${OPENCLAW_FEISHU_VERSION:-2026.6.9}
    restart: unless-stopped
    environment:
      # deploy.sh live generates and validates this token before starting the
      # profile; keeping the interpolation optional lets Demo Compose config
      # validate without a live-only secret.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      OPENCLAW_SKIP_ONBOARDING: "1"
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "18789"
    # Keep the Gateway reachable from the server host for an SSH tunnel, but
    # never bind it to a public interface. FastAPI uses the internal service
    # DNS name above; the browser never sees this port.
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - openclaw_home:/home/node/.openclaw
      - ./deploy/generated/openclaw.json:/opt/stayscape/openclaw.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${STAYSCAPE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  stayscape_pgdata:
  openclaw_home:
