services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stayscape
      POSTGRES_USER: stayscape
      POSTGRES_PASSWORD: stayscape
    volumes:
      - stayscape_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayscape -d stayscape"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production-32chars}
      DATABASE_URL: postgresql+psycopg://stayscape:stayscape@db:5432/stayscape
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openclaw/default}
      OPENCLAW_TRANSPORT: ${OPENCLAW_TRANSPORT:-gateway_tools}
      OPENCLAW_INVOKE_PATH: ${OPENCLAW_INVOKE_PATH:-/tools/invoke}
      OPENCLAW_TOOL_NAME: ${OPENCLAW_TOOL_NAME:-skill_invoke}
      OPENCLAW_SESSION_KEY: ${OPENCLAW_SESSION_KEY:-main}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-}
      OPENCLAW_LEGACY_FALLBACK: ${OPENCLAW_LEGACY_FALLBACK:-true}
      VISITOR_INTENT_HOLD_MINUTES: ${VISITOR_INTENT_HOLD_MINUTES:-30}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - server
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - web

volumes:
  stayscape_pgdata:
