services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stayscape}
      POSTGRES_USER: ${POSTGRES_USER:-stayscape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayscape}
    volumes:
      - stayscape_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-StayScape}
      SECRET_KEY: ${SECRET_KEY:-change-me-before-production-32chars}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stayscape}:${POSTGRES_PASSWORD:-stayscape}@db:5432/${POSTGRES_DB:-stayscape}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-openclaw/default}
      OPENCLAW_TRANSPORT: ${OPENCLAW_TRANSPORT:-responses}
      OPENCLAW_RESPONSES_PATH: ${OPENCLAW_RESPONSES_PATH:-/v1/responses}
      OPENCLAW_INVOKE_PATH: ${OPENCLAW_INVOKE_PATH:-/tools/invoke}
      OPENCLAW_TOOL_NAME: ${OPENCLAW_TOOL_NAME:-skill_invoke}
      OPENCLAW_SESSION_KEY: ${OPENCLAW_SESSION_KEY:-main}
      OPENCLAW_AGENT_ID: ${OPENCLAW_AGENT_ID:-}
      OPENCLAW_SKILL_VERSION: ${OPENCLAW_SKILL_VERSION:-1.0.0}
      CLAWHIVE_BASE_URL: ${CLAWHIVE_BASE_URL:-}
      CLAWHIVE_API_KEY: ${CLAWHIVE_API_KEY:-}
      CLAWHIVE_GATEWAY_TOKEN: ${CLAWHIVE_GATEWAY_TOKEN:-}
      CLAWHIVE_MODEL: ${CLAWHIVE_MODEL:-}
      CLAWHIVE_TRANSPORT: ${CLAWHIVE_TRANSPORT:-responses}
      CLAWHIVE_RESPONSES_PATH: ${CLAWHIVE_RESPONSES_PATH:-/v1/responses}
      CLAWHIVE_AGENT_ID: ${CLAWHIVE_AGENT_ID:-}
      CLAWHIVE_SKILL_VERSION: ${CLAWHIVE_SKILL_VERSION:-1.0.0}
      POSTER_EMBED_REMOTE_IMAGES: ${POSTER_EMBED_REMOTE_IMAGES:-false}
      OPENCLAW_LEGACY_FALLBACK: ${OPENCLAW_LEGACY_FALLBACK:-true}
      VISITOR_INTENT_HOLD_MINUTES: ${VISITOR_INTENT_HOLD_MINUTES:-30}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      SEED_DEMO_ON_STARTUP: ${SEED_DEMO_ON_STARTUP:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Allows a containerized StayScape server to call a native OpenClaw
      # Gateway on the same Linux host without exposing port 18789 publicly.
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${STAYSCAPE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  stayscape_pgdata:
