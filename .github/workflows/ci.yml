name: StayScape CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r apps/server/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: apps/server
        run: python -m pytest apps/server/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/web
      - name: Build frontend
        run: npm run build --prefix apps/web

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/stayscape-openclaw-plugin/package-lock.json
      - name: Build StayScape OpenClaw Tool Plugin
        run: npm ci --prefix integrations/stayscape-openclaw-plugin --ignore-scripts --legacy-peer-deps && npm run build --prefix integrations/stayscape-openclaw-plugin
      - name: Package both Skills
        run: python scripts/package_skills.py
      - name: Verify ZIP roots contain SKILL.md
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          for archive in Path("dist").glob("stayscape-*.zip"):
              with ZipFile(archive) as zf:
                  assert "SKILL.md" in zf.namelist(), archive

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose including live profile
        env:
          OPENCLAW_GATEWAY_TOKEN: ci-gateway-token
          STAYSCAPE_AGENT_TOOL_TOKEN: ci-tool-token
          QWEN_API_KEY: ci-qwen-key
        run: docker compose --profile live config

  openclaw-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render and inspect live config without secrets
        env:
          OPENCLAW_GATEWAY_TOKEN: ci-gateway-token
          STAYSCAPE_AGENT_TOOL_TOKEN: ci-tool-token
          OPENCLAW_PRIMARY_MODEL: qwen/qwen3.5-plus
          FEISHU_ENABLED: "false"
          FEISHU_APP_ID: ci-app
          FEISHU_APP_SECRET: ci-secret
          OPENCLAW_CONFIG_PATH: deploy/generated/ci-openclaw.json
        run: |
          python scripts/render_openclaw_config.py
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("deploy/generated/ci-openclaw.json").read_text())
          assert config["agents"]["defaults"]["model"]["primary"] == "qwen/qwen3.5-plus"
          assert config["channels"]["feishu"]["enabled"] is False
          assert "qwen" in config["plugins"]["allow"]
          assert "feishu" in config["plugins"]["allow"]
          assert "senderId" not in json.dumps(config["plugins"]["entries"]["stayscape-openclaw-plugin"])
          PY
      - name: Verify Agent discovery contract helper
        shell: bash
        run: |
          printf '%s\n' '{"agents":[{"id":"stayscape-main"}]}' | python scripts/verify_openclaw_agent.py
